aid: leah
name: Leah
description: Leah, formerly ContractPodAi and legally ContractPod Technologies Limited, is a London-headquartered
  enterprise agentic AI company that unifies contract lifecycle management, legal transformation, procurement,
  and finance operations into a single autonomous system. Its Leah Agentic OS platform provides skills-based
  orchestration, agentic workflows, a natural-language app builder, a library of domain-specific legal,
  contracting, procurement, and finance agents, and the Leah Maestro enterprise orchestrator. Leah is a
  five-time Gartner CLM Visionary, is SOC 2 Type II and ISO/IEC 27001:2022 certified, and is used by enterprises
  including PwC, KPMG, Philips, Alaska Airlines, MUFG, and Cushman & Wakefield. Leah ships pre-built connectors
  and describes open REST APIs for enterprise integration, but maintains no public developer portal or
  published API reference — API access is unlocked through the enterprise contract.
